name: Build Simple Live APKs

on:
  push:
    branches: [ "master", "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore /tmp/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=SL,OU=Dev,O=Dev,L=CN,S=CN,C=CN"
          for dir in simple_live_app simple_live_tv_app; do
            if [ -d "$dir/android" ]; then
              printf "storeFile=/tmp/release.jks\nstorePassword=123456\nkeyPassword=123456\nkeyAlias=key\n" > $dir/android/key.properties
            fi
          done

      - name: Build Mobile App
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build TV App
        working-directory: ./simple_live_tv_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-All-APKs
          path: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/*.apk
