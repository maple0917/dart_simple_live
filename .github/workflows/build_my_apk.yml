name: Build Simple Live APKs
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          cache: true

      - name: Generate Keystore
        run: keytool -genkey -v -keystore /tmp/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=SL,OU=Dev,O=Dev,L=CN,S=CN,C=CN"

      - name: Configure Mobile Signing
        run: printf "storeFile=/tmp/release.jks\nstorePassword=123456\nkeyPassword=123456\nkeyAlias=key\n" > simple_live_app/android/key.properties

      - name: Configure TV Signing
        run: printf "storeFile=/tmp/release.jks\nstorePassword=123456\nkeyPassword=123456\nkeyAlias=key\n" > simple_live_tv_app/android/key.properties

      - name: Build Mobile APK
        working-directory: ./simple_live_app
        run: flutter pub get && flutter build apk --release --split-per-abi

      - name: Build TV APK
        working-directory: ./simple_live_tv_app
        run: flutter pub get && flutter build apk --release --split-per-abi

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Mobile-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-TV-APK
          path: simple_live_tv_app/build/app/outputs/flutter-apk/*.apk
