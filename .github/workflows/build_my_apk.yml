name: Build Simple Live APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Create Keystore and key.properties
        run: |
          keytool -genkey -v -keystore $RUNNER_TEMP/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=SL,OU=Dev,O=Dev,L=CN,S=CN,C=CN"
          for dir in simple_live_app simple_live_tv_app; do
            echo "storeFile=$RUNNER_TEMP/keystore.jks" > $dir/android/key.properties
            echo "storePassword=123456" >> $dir/android/key.properties
            echo "keyPassword=123456" >> $dir/android/key.properties
            echo "keyAlias=key" >> $dir/android/key.properties
          done

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: false

      - name: Fix Mirrors and Lock Plugins
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.12-all.zip#g' simple_live_app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.12-all.zip#g' simple_live_tv_app/android/gradle/wrapper/gradle-wrapper.properties
          find simple_live_app/android simple_live_tv_app/android "$FLUTTER_ROOT" -name "*.gradle*" -type f -exec sed -i 's/gradlePluginPortal()/mavenCentral()\n        google()/g' {} + || true

          for pub in simple_live_app/pubspec.yaml simple_live_tv_app/pubspec.yaml; do
            if [ -f "$pub" ]; then
              sed -i 's/auto_orientation_v2:.*/auto_orientation_v2: 2.3.2/g' "$pub"
              sed -i 's/dynamic_color:.*/dynamic_color: 1.7.0/g' "$pub"
            fi
          done

      - name: Build Mobile APK
        run: |
          cd simple_live_app
          flutter pub get
          
          # 1. 彻底清理不兼容的 kotlin {} 块
          python3 -c '
          import glob, os, re
          files = glob.glob(os.path.expanduser("~/.pub-cache/**/android/build.gradle*"), recursive=True)
          for f in files:
              with open(f, "r", encoding="utf-8") as fp:
                  c = fp.read()
              nc = re.sub(r"\bkotlin\s*\{(?:[^{}]|\{[^{}]*\})*\}", "", c)
              if nc != c:
                  with open(f, "w", encoding="utf-8") as fp:
                      fp.write(nc)
          '
          
          # 2. 预先通过直连镜像将 media_kit 依赖的 jar 包下载并塞进缓存，彻底绕过联网下载
          mkdir -p ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-1.1.7/android/.gradle/lib/
          curl -L -o ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-1.1.7/android/.gradle/lib/default-arm64-v8a.jar "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-arm64-v8a.jar" || true
          curl -L -o ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-1.1.7/android/.gradle/lib/default-armeabi-v7a.jar "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-armeabi-v7a.jar" || true

          flutter build apk --release --split-per-abi
          mkdir -p $RUNNER_TEMP/apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $RUNNER_TEMP/apks/SimpleLive-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk $RUNNER_TEMP/apks/SimpleLive-Mobile-armeabi-v7a.apk

      - name: Build TV APK
        run: |
          cd simple_live_tv_app
          flutter pub get
          
          python3 -c '
          import glob, os, re
          files = glob.glob(os.path.expanduser("~/.pub-cache/**/android/build.gradle*"), recursive=True)
          for f in files:
              with open(f, "r", encoding="utf-8") as fp:
                  c = fp.read()
              nc = re.sub(r"\bkotlin\s*\{(?:[^{}]|\{[^{}]*\})*\}", "", c)
              if nc != c:
                  with open(f, "w", encoding="utf-8") as fp:
                      fp.write(nc)
          '
          
          mkdir -p ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-1.1.7/android/.gradle/lib/
          curl -L -o ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-1.1.7/android/.gradle/lib/default-arm64-v8a.jar "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-arm64-v8a.jar" || true
          curl -L -o ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-1.1.7/android/.gradle/lib/default-armeabi-v7a.jar "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-armeabi-v7a.jar" || true

          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $RUNNER_TEMP/apks/SimpleLive-TV-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk $RUNNER_TEMP/apks/SimpleLive-TV-armeabi-v7a.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Simple Live 手机版 & TV版安装包"
          body: |
            自动编译完成，直接点击下方对应文件即可下载安装：
            * **手机端安装**：`SimpleLive-Mobile-arm64-v8a.apk`
            * **电视端安装（64位）**：`SimpleLive-TV-arm64-v8a.apk`
            * **电视端安装（32位通用/老电视）**：`SimpleLive-TV-armeabi-v7a.apk`
          files: |
            ${{ runner.temp }}/apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
